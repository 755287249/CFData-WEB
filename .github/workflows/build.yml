name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label"
        required: false
        default: "custom-v4.6-nsb"
        type: string

  push:
    branches:
      - main
    paths:
      - "combined_refactor/**"
      - "tools/cfdata_custom_patch.py"
      - "tools/cfdata_nsb_patch.py"
      - "tools/cfdata_v45_ui_history_patch.py"
      - "tools/cfdata_v46_loss_patch.py"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-windows-amd64:
    name: Build Windows amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: true
          cache-dependency-path: combined_refactor/go.sum

      - name: Set version
        id: version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="custom-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "Build version: $version"

      - name: Apply custom CFData patches
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          LANG: "C.UTF-8"
          LC_ALL: "C.UTF-8"
        run: |
          python3 -m py_compile tools/cfdata_custom_patch.py tools/cfdata_nsb_patch.py tools/cfdata_nsb_field_fix_patch.py tools/cfdata_speed_target_fix_patch.py tools/cfdata_v45_ui_history_patch.py tools/cfdata_v46_loss_patch.py
          python3 tools/cfdata_custom_patch.py
          python3 tools/cfdata_nsb_patch.py
          python3 tools/cfdata_nsb_field_fix_patch.py
          python3 tools/cfdata_speed_target_fix_patch.py
          python3 tools/cfdata_v45_ui_history_patch.py
          python3 tools/cfdata_v46_loss_patch.py
          gofmt -w combined_refactor/utils.go combined_refactor/tasks_nsb.go combined_refactor/protocol.go combined_refactor/server.go combined_refactor/cli.go

      - name: Download CA certificates
        shell: bash
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            -o combined_refactor/ca-certificates.crt

      - name: Verify Go build
        shell: bash
        run: |
          cd combined_refactor
          go test ./...

      - name: Build Windows amd64 EXE
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p release_assets
          cd combined_refactor
          go build \
            -trimpath \
            -ldflags "-s -w -X main.appVersion=${{ steps.version.outputs.VERSION }}" \
            -o ../release_assets/cfdata-windows-amd64.exe \
            .

      - name: Generate SHA256
        shell: bash
        run: |
          cd release_assets
          sha256sum cfdata-windows-amd64.exe | awk '{print $1}' > cfdata-windows-amd64.exe.sha256

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: cfdata-windows-amd64
          path: |
            release_assets/cfdata-windows-amd64.exe
            release_assets/cfdata-windows-amd64.exe.sha256
          if-no-files-found: error
          retention-days: 30
